<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>محاكي العيادة السنية الذكي</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg:#f8fafc; --card:#ffffff; --ink:#0f172a; --sub:#64748b; --line:#e2e8f0;
    --accent:#075985; --accent2:#0369a1;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0f172a; --card:#1e293b; --ink:#f1f5f9; --sub:#94a3b8; --line:#334155; }
  }
  :root[data-theme="dark"]{ --bg:#0f172a; --card:#1e293b; --ink:#f1f5f9; --sub:#94a3b8; --line:#334155; }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
  body{ background:var(--bg); color:var(--ink); height:100%; margin:0; font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; }
  .card{ background:var(--card); border:1px solid var(--line); }
  .sub{ color:var(--sub); }
  .btn{ background:var(--accent); color:#fff; }
  .btn:hover{ background:var(--accent2); }
</style>
</head>
<body>
<div id="app" class="max-w-3xl mx-auto p-4 sm:p-6"></div>

<script>
/* ===================== بيانات الحالات (نفس المصادر السريرية السابقة) ===================== */
const DEPTS = [
  { id:"endo", name:"قسم الإندودونتيا (علاج الجذور)", icon:"🦷" },
  { id:"trauma", name:"قسم رضوض الأسنان لدى الأطفال", icon:"👶" },
  { id:"perio", name:"قسم أمراض دواعم السن", icon:"🩸" },
  { id:"path", name:"قسم أمراض الفم", icon:"🔬" },
];

function svgRadiographPA46(){
  return `<svg viewBox="0 0 320 220" class="w-full max-w-sm rounded-lg border" style="border-color:#334155;background:#000">
    <path d="M118 30 Q124 18 150 18 Q176 18 182 30 L180 56 Q150 64 120 56 Z" fill="#e2e8f0"/>
    <rect x="122" y="56" width="56" height="22" fill="#cbd5e1"/>
    <rect x="142" y="58" width="16" height="14" fill="#475569"/>
    <path d="M128 78 L118 150 L138 168 L144 100 Z" fill="#cbd5e1"/>
    <path d="M172 78 L182 150 L162 168 L156 100 Z" fill="#cbd5e1"/>
    <ellipse cx="130" cy="160" rx="24" ry="18" fill="#0a0a0a" stroke="#ef4444" stroke-dasharray="4 3" stroke-width="1.5"/>
    <line x1="150" y1="168" x2="228" y2="150" stroke="#ef4444"/>
    <text x="230" y="147" fill="#f1f5f9" font-size="10">انحلال محيط الذروة</text>
    <text x="96" y="200" fill="#94a3b8" font-size="9">السن 46 — أشعة PA</text>
  </svg>`;
}
function svgBoneLoss(){
  let teeth=[90,140,190,240], g="";
  teeth.forEach(x=>{
    g+=`<path d="M${x-13} 30 Q${x} 22 ${x+13} 30 L${x+11} 50 L${x-11} 50 Z" fill="#e2e8f0"/>
    <rect x="${x-11}" y="50" width="22" height="18" fill="#cbd5e1"/>
    <path d="M${x-11} 68 L${x} 148 L${x+11} 68 Z" fill="#cbd5e1"/>`;
  });
  return `<svg viewBox="0 0 320 220" class="w-full max-w-sm rounded-lg border" style="border-color:#334155;background:#000">
    ${g}
    <line x1="55" y1="76" x2="275" y2="76" stroke="#64748b" stroke-dasharray="3 3"/>
    <line x1="55" y1="106" x2="275" y2="106" stroke="#ef4444" stroke-width="1.5"/>
    <text x="160" y="18" fill="#94a3b8" font-size="9" text-anchor="middle">مستوى طبيعي (متقطع) مقابل الحالي</text>
    <text x="150" y="130" fill="#f1f5f9" font-size="10" text-anchor="middle">فقدان عظمي أفقي &gt;30%</text>
  </svg>`;
}
function svgSocket(){
  return `<svg viewBox="0 0 300 200" class="w-full max-w-sm rounded-lg border" style="border-color:#fecdd3;background:#fdf2f2">
    <path d="M15 118 Q150 92 285 118 L285 165 L15 165 Z" fill="#f3b9b4"/>
    <rect x="48" y="66" width="32" height="58" rx="6" fill="#fdfdfd" stroke="#dba8a2"/>
    <rect x="220" y="66" width="32" height="58" rx="6" fill="#fdfdfd" stroke="#dba8a2"/>
    <ellipse cx="150" cy="122" rx="22" ry="13" fill="#7a2b2b"/>
    <ellipse cx="150" cy="118" rx="15" ry="8" fill="#c0392b"/>
    <text x="86" y="188" fill="#7a2b2b" font-size="10">سنخ فارغ — قلع كامل (Avulsion)</text>
  </svg>`;
}
function svgPerio(){
  const sites=[[45,6,1],[105,5,1],[165,6,1],[225,3,0]];
  let bars="";
  sites.forEach(([x,d,bop])=>{
    bars+=`<rect x="${x-12}" y="${170-d*14}" width="24" height="${d*14}" fill="${bop?'#ef4444':'#94a3b8'}" opacity="${bop?0.85:0.5}" rx="3"/>
    <text x="${x}" y="185" fill="#475569" font-size="9" text-anchor="middle">${d}مم</text>`;
  });
  return `<svg viewBox="0 0 300 200" class="w-full max-w-sm rounded-lg border" style="border-color:#e2e8f0;background:#f8fafc">
    <line x1="20" y1="170" x2="280" y2="170" stroke="#94a3b8"/>
    ${bars}
    <text x="150" y="20" fill="#334155" font-size="10" text-anchor="middle">نزف عند السبر (BOP) + جيوب 5-6مم</text>
  </svg>`;
}
function svgUlcer(){
  return `<svg viewBox="0 0 300 200" class="w-full max-w-sm rounded-lg border" style="border-color:#fecdd3;background:#fdeeee">
    <path d="M10 60 Q150 20 290 60 L290 160 Q150 190 10 160 Z" fill="#f4a6a0"/>
    <ellipse cx="150" cy="110" rx="20" ry="14" fill="#ef4444" opacity="0.55"/>
    <ellipse cx="150" cy="110" rx="12" ry="8" fill="#fde68a"/>
    <path d="M205 95 L225 70 L232 100 Z" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="236" y="90" fill="#7a2b2b" font-size="9">سن 36 حادة/مكسورة</text>
    <text x="90" y="182" fill="#7a2b2b" font-size="10">قرحة ~6مم، مركز أصفر، هالة حمراء</text>
  </svg>`;
}

const CASES = [
  { id:"case-1", dept:"endo", patientType:"adult", tooth:"46",
    intro:"أنا أحمد، عمري 45 سنة، عندي وجع بسني من فترة وما عم يوقف. بيصحيني من نومي بالليل، وإذا حطيت شي بارد أو سخن عالسن بضل يوجعني لمدة طويلة.",
    history:[
      {q:"متى بدأ الألم؟", a:"قبل أسبوعين تقريباً، وصار أسوأ بالأيام الأخيرة."},
      {q:"شو يحرّض الألم؟", a:"البارد والسخن، وأحياناً بيجيني لحاله وخاصة بالليل."},
      {q:"قدرت تحدد مكان الوجع؟", a:"هلق واضح إنه بالضرس السفلي الأيمن الخلفي."},
    ],
    requiresPA:true,
    investigations:[
      {id:"inv-pa", label:"طلب أشعة PA", points:0, isPA:true, svg:svgRadiographPA46(),
       note:"انحلال محيط الذروة بالسن 46 — متوافق مع تشخيص لبّي التهابي.",
       source:"FDA/ADA ALARA — PA كخط أول للتشخيص"},
      {id:"inv-cbct", label:"طلب أشعة CBCT", points:-15,
       warn:"لا استطباب لـCBCT بحالة بسيطة بسن واحدة — يخالف مبدأ ALARA.",
       source:"FDA/ADA ALARA (Gamification Logic §4)"},
    ],
    diagnoses:[
      {id:"dx-rev", label:"التهاب لبّي رجعي (Reversible Pulpitis)", correct:false, points:-20,
       source:"أقرب قيمة موثّقة (AAP 2017 §6) — لا رقم صريح لهذا الخيار."},
      {id:"dx-irrev", label:"التهاب لبّي عكوس شديد الأعراض", correct:true, points:50,
       source:"AAE Consensus 2009 — ألم عفوي/حروري يوقظ المريض ليلاً."},
    ],
    citation:"AAE Consensus 2009 + FDA/ADA ALARA Principles." },

  { id:"case-2", dept:"trauma", patientType:"child", tooth:"الثنية العلوية (Avulsion كامل)",
    intro:"أنا أم كريم، ابني عمره 8 سنين وقع من الأرجوحة وسنّه الأمامية طاحت بالكامل. شو لازم أعمل؟",
    history:[
      {q:"قديش صار وقت من الحادثة؟", a:"20 دقيقة تقريباً."},
      {q:"وين حاطة السن هلق؟", a:"قابضة عليها بإيدي، ما حطيتها بشي."},
    ],
    requiresPA:false,
    investigations:[
      {id:"inv-socket", label:"الفحص السريري للسنخ", points:0, svg:svgSocket(),
       note:"السنخ فارغ تماماً — قلع كامل (Avulsion)، لا جذر متبقٍّ.",
       source:"IADT 2020 — توثيق السنخ فور الرضّ"},
    ],
    diagnoses:[
      {id:"dx-water", label:"غسل السن بالصابون وحفظها بمي الحنفية", correct:false, points:-40,
       source:"IADT 2020 — يُمنع استخدام مي الحنفية إطلاقاً."},
      {id:"dx-milk", label:"حفظ السن بحليب بارد/HBSS والمجيء فوراً", correct:true, points:50,
       source:"IADT 2020 — إعادة الزرع الفوري أو الحفظ بحليب بارد/HBSS."},
    ],
    citation:"IADT Guidelines 2020 — بروتوكول الـ Avulsion الكامل." },

  { id:"case-3", dept:"perio", patientType:"adult", tooth:"الأسنان الأمامية السفلية",
    intro:"بتنزف لثتي كل ما بفرشي أسناني، ولاحظت إنه أسناني الأمامية السفلية صارت مهزوزة شوي.",
    history:[
      {q:"هل انت مدخن؟", a:"إي، من 20 سنة، علبة تقريباً باليوم."},
      {q:"عندك أمراض مزمنة؟", a:"لأ، ولا آخد أدوية دائمة."},
    ],
    requiresPA:true,
    perioEvidence:["inv-pa2","inv-probe"],
    investigations:[
      {id:"inv-pa2", label:"طلب أشعة PA", points:0, isPA:true, svg:svgBoneLoss(),
       note:"فقدان عظمي أفقي أكثر من 30%.", source:"AAP 2017 — فقدان العظم الشعاعي معيار أساسي"},
      {id:"inv-probe", label:"سبر وتخطيط لثوي", points:0, svg:svgPerio(),
       note:"نزف عند السبر (BOP) مع جيوب 5-6مم.", source:"AAP 2017 — BOP وعمق الجيوب"},
    ],
    diagnoses:[
      {id:"dx-ging", label:"التهاب لثة مرتبط باللويحة الجرثومية", correct:false, points:-20,
       source:"أقرب قيمة موثّقة (AAP 2017 §6)."},
      {id:"dx-perio", label:"التهاب دواعم السن (Periodontitis)", correct:true, points:50,
       source:"AAP 2017 — BOP + فقدان ارتباط سريري + فقدان عظمي شعاعي."},
    ],
    citation:"AAP 2017 Classification." },

  { id:"case-4", dept:"path", patientType:"adult", tooth:"الحافة الوحشية للسان",
    intro:"عندي قرحة موجعة بجنب لساني من كم يوم، وبتوجعني وأنا عم بحكي أو باكل.",
    history:[
      {q:"من متى وأنت حاسس فيها؟", a:"من 4 أيام تقريباً، ظهرت فجأة وضلت."},
      {q:"في سن حادة أو مكسورة جنبها؟", a:"إي، ضرس مكسور بالفك السفلي الشمال بيحك بلساني."},
      {q:"القرحة عم تكبر؟", a:"لأ، ثابتة على نفس الحجم."},
    ],
    requiresPA:false,
    investigations:[
      {id:"inv-ulcer", label:"الفحص السريري للقرحة", points:0, svg:svgUlcer(),
       note:"قرحة ~6مم، مركز أصفر-أبيض وهالة حمراء، مجاورة لسن 36 حادة.",
       source:"Neville Oral Pathology — وصف القرحة الرضّية"},
    ],
    diagnoses:[
      {id:"dx-scc", label:"سرطانة خلايا حرشفية (SCC)", correct:false, points:-25,
       source:"أقرب قيمة موثّقة (Gamification Logic §4) لتخمين خطير بلا دليل."},
      {id:"dx-ulcer", label:"قرحة رضّية (Traumatic Ulcer)", correct:true, points:50,
       source:"Neville — مرتبطة بسن حادة، تُشفى خلال 10-14 يوماً."},
    ],
    citation:"Neville Oral and Maxillofacial Pathology." },
];

/* ===================== الحالة والتخزين ===================== */
let state = { view:"depts", dept:null, caseId:null, score:100, log:[], case:{} };
try{ const s=localStorage.getItem('dentalSim_score'); if(s) state.score=JSON.parse(s).score, state.log=JSON.parse(s).log; }catch(e){}
function persistScore(){ try{ localStorage.setItem('dentalSim_score', JSON.stringify({score:state.score, log:state.log})); }catch(e){} }
function logAction(label, points, source){
  state.score += points;
  state.log.push({label, points, source, time:new Date().toLocaleString('ar-EG')});
  persistScore();
}
function bonusClaimedToday(){ try{ return localStorage.getItem('dentalSim_bonusDate')===new Date().toDateString(); }catch(e){ return false; } }

/* ===================== الواجهة ===================== */
const app = document.getElementById('app');
function render(){ app.innerHTML = view(); }

function scoreBadge(){
  return `<div class="flex items-center gap-2 rounded-full px-4 py-1.5 text-white" style="background:#1e293b">
    <span>🏆</span><span class="text-sm">الرصيد:</span><b class="tabular-nums">${state.score}</b></div>`;
}

function view(){
  if(state.view==="depts") return viewDepts();
  if(state.view==="cases") return viewCases();
  if(state.view==="case") return viewCase();
  if(state.view==="summary") return viewSummary();
  return "";
}

function viewDepts(){
  return `
  <div class="space-y-5">
    <header class="flex items-center justify-between border-b pb-4" style="border-color:var(--line)">
      <div class="flex items-center gap-3">
        <div class="rounded-lg p-2.5 text-white text-xl" style="background:var(--accent)">🩺</div>
        <div><h1 class="text-xl font-bold">محاكي العيادة السنية الذكي</h1>
        <p class="sub text-sm">اختر قسم العيادة</p></div>
      </div>${scoreBadge()}
    </header>
    <div class="flex items-start gap-2 rounded-md px-4 py-3 text-sm" style="background:#fffbeb;color:#92400e;border:1px solid #fde68a">
      ℹ️ محاكاة تعليمية فقط — لا تُغني عن التقييم السريري الفعلي.
    </div>
    <div class="flex flex-wrap gap-3">
      <button onclick="claimBonus()" ${bonusClaimedToday()?"disabled":""}
        class="rounded-md border px-4 py-2 text-sm font-medium" style="border-color:var(--accent);color:var(--accent)">
        📅 ${bonusClaimedToday()?"تم استلام مكافأة اليوم":"مكافأة الدخول اليومي (+10)"}
      </button>
      ${state.log.length ? `<button onclick="goSummary()" class="rounded-md border px-4 py-2 text-sm font-medium card">📋 ملخص الجلسة</button>` : ""}
    </div>
    <div class="grid gap-3 sm:grid-cols-2">
      ${DEPTS.map(d=>`
        <button onclick="openDept('${d.id}')" class="card rounded-lg p-5 text-right shadow-sm hover:shadow transition">
          <div class="text-2xl mb-2">${d.icon}</div>
          <div class="font-semibold">${d.name}</div>
          <div class="sub text-xs mt-1">${CASES.filter(c=>c.dept===d.id).length} حالة</div>
        </button>`).join("")}
    </div>
  </div>`;
}

function viewCases(){
  const dept = DEPTS.find(d=>d.id===state.dept);
  const list = CASES.filter(c=>c.dept===state.dept);
  return `
  <div class="space-y-4">
    <button onclick="goDepts()" class="sub text-sm">‹ العودة إلى الأقسام</button>
    <h2 class="text-lg font-bold">${dept.icon} ${dept.name}</h2>
    <div class="grid gap-3 sm:grid-cols-2">
      ${list.map(c=>`
        <button onclick="openCase('${c.id}')" class="card rounded-lg p-4 text-right shadow-sm hover:shadow transition flex gap-3">
          <div class="text-xl">${c.patientType==="child"?"👶":"🧑"}</div>
          <div><div class="font-medium">الحالة: ${c.tooth}</div>
          <div class="sub text-sm mt-1 line-clamp-2">${c.intro}</div></div>
        </button>`).join("")}
    </div>
  </div>`;
}

function viewCase(){
  const c = CASES.find(x=>x.id===state.caseId);
  const cs = state.case;
  const historyDone = cs.hist >= c.history.length;
  let html = `<div class="space-y-4">
    <button onclick="goCases()" class="sub text-sm">‹ العودة إلى الحالات</button>
    <section class="card rounded-lg p-5 shadow-sm flex gap-3">
      <div class="text-2xl">${c.patientType==="child"?"👶":"🧑"}</div>
      <p class="leading-relaxed">${c.intro}</p>
    </section>`;

  if(!cs.outcome){
    html += `<section class="card rounded-lg p-4 space-y-3">
      <h3 class="font-semibold text-sm">💬 أخذ التاريخ المرضي</h3>`;
    for(let i=0;i<cs.hist;i++){
      html += `<div class="space-y-1">
        <div class="rounded-lg px-3 py-2 text-sm" style="background:#e0f2fe">س: ${c.history[i].q}</div>
        <div class="rounded-lg px-3 py-2 text-sm" style="background:var(--card);border:1px solid var(--line)">ج: ${c.history[i].a}</div>
      </div>`;
    }
    if(!historyDone) html += `<button onclick="askNext()" class="btn rounded-md px-4 py-2 text-sm">اطرح السؤال التالي</button>`;
    html += `</section>`;

    if(historyDone && !cs.examStarted){
      html += `<button onclick="beginExam()" class="btn rounded-md px-5 py-2.5 text-sm">بدء الفحص السريري ›</button>`;
    }

    if(cs.examStarted){
      html += `<section class="space-y-3"><h3 class="font-semibold text-sm">🩻 الفحوصات والاستقصاءات</h3>`;
      c.investigations.forEach(inv=>{
        const req = cs.inv[inv.id];
        html += `<div class="card rounded-lg p-4">
          <div class="flex items-center justify-between gap-3">
            <span class="text-sm font-medium">${inv.label}</span>
            <button onclick="requestInv('${inv.id}')" ${req?"disabled":""} class="rounded-md border px-3 py-1.5 text-xs" style="border-color:var(--line)">${req?"تم الطلب":"طلب"}</button>
          </div>
          ${req?`<div class="mt-3 space-y-2">${inv.svg||""}${inv.note?`<p class="text-sm sub">${inv.note}</p>`:""}${inv.warn?`<p class="text-sm rounded-md p-2" style="background:#fef2f2;color:#b91c1c">⚠️ ${inv.warn}</p>`:""}</div>`:""}
        </div>`;
      });
      html += `</section>
      <section class="card rounded-lg p-4 space-y-2">
        <h3 class="font-semibold text-sm">🧠 التشخيص / القرار السريري</h3>
        ${c.diagnoses.map(d=>`
          <label class="flex items-center gap-3 rounded-md border px-3 py-2.5 text-sm cursor-pointer" style="border-color:${cs.dx===d.id?'var(--accent)':'var(--line)'}">
            <input type="radio" name="dx" ${cs.dx===d.id?"checked":""} onclick="pickDx('${d.id}')"> ${d.label}
          </label>`).join("")}
        <button onclick="submitDx()" ${!cs.dx?"disabled":""} class="btn rounded-md px-5 py-2 text-sm mt-2">تأكيد القرار</button>
      </section>`;
    }
  } else {
    const o = cs.outcome;
    html += `<section class="card rounded-lg p-5 space-y-3">
      <div class="font-semibold">${o.correct?"✅ قرار صحيح":"❌ قرار غير دقيق"} — <span style="color:${o.points>0?'#059669':'#be123c'}">${o.points>0?"+":""}${o.points} نقطة</span></div>
      ${o.note?`<p style="color:#be123c" class="text-sm">${o.note}</p>`:""}
      ${cs.paMissing?`<p class="text-sm rounded-md p-2" style="background:#fef2f2;color:#b91c1c">⚠️ لم تُطلب أشعة PA قبل القرار (-10)</p>`:""}
      <p class="text-sm sub">📚 ${c.citation}</p>
      <button onclick="goCases()" class="rounded-md border px-4 py-2 text-sm card">‹ العودة إلى الحالات</button>
    </section>`;
  }
  html += `</div>`;
  return html;
}

function viewSummary(){
  return `<div class="space-y-4">
    <button onclick="goDepts()" class="sub text-sm">‹ العودة إلى الأقسام</button>
    <header class="flex items-center justify-between border-b pb-3" style="border-color:var(--line)">
      <h2 class="text-lg font-bold">ملخص الجلسة</h2>${scoreBadge()}
    </header>
    <div class="card rounded-lg overflow-x-auto">
      <table class="w-full text-sm text-right">
        <thead class="text-xs sub"><tr><th class="p-2">الإجراء</th><th class="p-2">النقاط</th><th class="p-2">المصدر</th></tr></thead>
        <tbody>${state.log.map(e=>`<tr class="border-t" style="border-color:var(--line)">
          <td class="p-2">${e.label}</td>
          <td class="p-2" style="color:${e.points>=0?'#059669':'#be123c'}">${e.points>0?"+":""}${e.points}</td>
          <td class="p-2 sub">${e.source}</td></tr>`).join("")}</tbody>
      </table>
    </div>
  </div>`;
}

/* ===================== أفعال ===================== */
function goDepts(){ state.view="depts"; render(); }
function goCases(){ state.view="cases"; render(); }
function goSummary(){ state.view="summary"; render(); }
function openDept(id){ state.dept=id; state.view="cases"; render(); }
function openCase(id){ state.caseId=id; state.case={hist:0, examStarted:false, inv:{}, dx:null, outcome:null, paMissing:false}; state.view="case"; render(); }
function askNext(){ state.case.hist++; render(); }
function beginExam(){ state.case.examStarted=true; render(); }
function requestInv(id){
  const c = CASES.find(x=>x.id===state.caseId);
  const inv = c.investigations.find(i=>i.id===id);
  if(state.case.inv[id]) return;
  state.case.inv[id]=true;
  logAction(`${c.dept} — ${inv.label}`, inv.points, inv.source);
  render();
}
function pickDx(id){ state.case.dx=id; render(); }
function submitDx(){
  const c = CASES.find(x=>x.id===state.caseId);
  const d = c.diagnoses.find(x=>x.id===state.case.dx);
  let points=d.points, correct=d.correct, note=null;
  if(d.id==="dx-perio" && c.perioEvidence){
    const ok = c.perioEvidence.every(id=>state.case.inv[id]);
    if(!ok){ points=-20; correct=false; note="لا يمكن تشخيص التهاب دواعم السن دون سبر وأشعة كاملين (AAP 2017 §6)."; }
  }
  logAction(`${c.dept} — ${d.label}`, points, note||d.source);
  if(c.requiresPA){
    const paInv = c.investigations.find(i=>i.isPA);
    if(paInv && !state.case.inv[paInv.id]){
      state.case.paMissing=true;
      logAction(`${c.dept} — تشخيص دون PA مسبقة`, -10, "قاعدة المشروع 2");
    }
  }
  state.case.outcome={points, correct, note};
  render();
}
function claimBonus(){
  if(bonusClaimedToday()) return;
  logAction("مكافأة الدخول اليومي", 10, "مكافأة تفاعل يومية — تلعيب وليست قاعدة سريرية.");
  try{ localStorage.setItem('dentalSim_bonusDate', new Date().toDateString()); }catch(e){}
  render();
}

render();
</script>

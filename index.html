if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(!j.text)throw new Error(j.error||'empty');return j.text}
function kw(q){const w=s=>s.toLowerCase().replace(/[^\p{L}\p{N} ]/gu,' ').split(/\s+/).filter(x=>x.length>2);const qw=w(q);let b=null,bs=0;
C().h.forEach(x=>{const s=w(x[0].join(' ')+' '+x[1].join(' ')).filter(y=>qw.includes(y)).length;if(s>bs){bs=s;b=x}});

async function evs(){const q=document.getElementById('q').value.trim();if(!q)return;
const yr=+document.getElementById('yr').value||1900,srt=document.getElementById('so').value,pm=document.getElementById('spm').checked,ep=document.getElementById('sep').checked;
EV={r:[],err:[],busy:true,abs:{},done:false};upd();
const jobs=[];
if(pm)jobs.push((async()=>{const B='https://eutils.ncbi.nlm.nih.gov/entrez/eutils/';
const a=await fetch(`${B}esearch.fcgi?db=pubmed&retmode=json&retmax=8&term=${encodeURIComponent(q)}&datetype=pdat&mindate=${yr}&maxdate=3000&sort=${srt=='d'?'pub_date':'relevance'}`);
if(!a.ok)throw new Error('HTTP '+a.status);const ids=(await a.json()).esearchresult.idlist;if(!ids.length)return[];
const b=await fetch(`${B}esummary.fcgi?db=pubmed&retmode=json&id=${ids.join(',')}`);if(!b.ok)throw new Error('HTTP '+b.status);const j=(await b.json()).result;
return ids.map(id=>{const r=j[id];return{s:'PubMed',id:'PMID:'+id,pm:id,t:r.title,a:(r.authors||[]).slice(0,4).map(x=>x.name).join(', ')+((r.authors||[]).length>4?' et al.':''),j:r.fulljournalname,y:(r.pubdate||'').slice(0,4),
doi:((r.articleids||[]).find(x=>x.idtype=='doi')||{}).value,u:'https://pubmed.ncbi.nlm.nih.gov/'+id+'/',ab:null,oa:false}})})().catch(e=>{EV.err.push('PubMed: '+e.message);return[]}));
if(ep)jobs.push((async()=>{const a=await fetch(`https://www.ebi.ac.uk/europepmc/webservices/rest/search?format=json&resultType=core&pageSize=8&query=${encodeURIComponent(q+' AND PUB_YEAR:['+yr+' TO 3000]')}${srt=='d'?encodeURIComponent(' sort_date:y'):''}`);
if(!a.ok)throw new Error('HTTP '+a.status);const l=(await a.json()).resultList.result||[];
return l.map(r=>({s:'Europe PMC',id:r.source+':'+r.id,t:(r.title||'').replace(/<[^>]+>/g,''),a:r.authorString||'',j:r.journalTitle||'',y:r.pubYear||'',doi:r.doi,u:'https://europepmc.org/article/'+r.source+'/'+r.id,
ab:r.abstractText?r.abstractText.replace(/<[^>]+>/g,''):'',oa:r.isOpenAccess=='Y'}))})().catch(e=>{EV.err.push('Europe PMC: '+e.message);return[]}));
const out=await Promise.all(jobs);EV.r=out.flat();EV.busy=false;EV.done=true;
EV.r.forEach((x,i)=>{if(x.ab)EV.abs[i]=null});upd()}

x.ab=t;EV.abs[i]=t}catch(e){EV.abs[i]='Error: '+e.message}}else EV.abs[i]=T(['لا يتوفر ملخص في السجل.','No abstract in record.']);upd()}

export default {
  async fetch(req, env) {
    const allow = env.ALLOWED_ORIGIN, o = req.headers.get('Origin') || '';
    const cors = {'Access-Control-Allow-Origin': allow, 'Access-Control-Allow-Methods': 'POST, OPTIONS', 'Access-Control-Allow-Headers': 'Content-Type'};
    const out = (b, s = 200) => new Response(JSON.stringify(b), {status: s, headers: {...cors, 'content-type': 'application/json'}});
    if (req.method === 'OPTIONS') return new Response(null, {headers: cors});
    if (req.method !== 'POST' || o !== allow) return out({error: 'forbidden'}, 403);
    let b; try { b = await req.json(); } catch { return out({error: 'bad json'}, 400); }
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'content-type': 'application/json', 'x-api-key': env.ANTHROPIC_API_KEY, 'anthropic-version': '2023-06-01'},
      body: JSON.stringify({model: 'claude-haiku-5-5', max_tokens: 400, system: String(b.system || '').slice(0, 6000), messages: (b.messages || []).slice(-12)})
    });
    const j = await r.json();
    const t = (j.content || []).map(x => x.text || '').join('');
    return t ? out({text: t}) : out({error: (j.error && j.error.message) || 'api error'}, 502);
  }
